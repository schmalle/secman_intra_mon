[project]
name = "secman-intra-mon"
version = "0.1.0"
description = "Iterative intranet asset discovery extension for secman"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Markus Schmall" }]
dependencies = [
    "httpx>=0.27",
    "psutil>=6.0",
    "pymysql>=1.1",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
secman-intra-mon = "secman_intra_mon.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secman_intra_mon"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true
